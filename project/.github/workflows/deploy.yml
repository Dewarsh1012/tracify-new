name: CI/CD Pipeline — Blockchain Forensics ML Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Test Inference API
      run: |
        python -c "from src.inference import ForensicPredictor; predictor = ForensicPredictor(); print(predictor.predict_relevance({'value_ratio':0.5,'time_delta':100,'same_asset':1,'hop_count':2,'amount_similarity':0.8,'degree':5,'fanout':2,'fanin':2,'address_age':300,'transaction_frequency':10,'entity_evidence':1,'path_length':3}))"

    - name: Build Docker Image
      run: |
        docker build -t blockchain-forensics-ml:latest .
